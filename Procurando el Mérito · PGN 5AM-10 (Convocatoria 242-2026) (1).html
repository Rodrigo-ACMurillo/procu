  <!-- LÓGICA DE APLICACIÓN, BASE DE DATOS AUDITADA Y SERVICE WORKER PWA     -->
  <!-- ===================================================================== -->
  <script>
    /* =====================================================================
       1. REGISTRO DINÁMICO DE MANIFEST PWA Y SERVICE WORKER EMBEBIDO OFFLINE
       ===================================================================== */
    let deferredInstallPrompt = null;
    let swStatusText = 'Almacenamiento local activo (100% autónomo)';

    (function initPWA() {
      try {
        // Icono SVG editorial embebido como Data URI para el Manifiesto Web
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#2d5a43"/><path d="M256 96v320M128 168h256M128 168l-56 112h112l-56-112zm256 0l-56 112h112l-56-112zM184 416h144" stroke="#f9f8f5" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
        const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

        const manifestObj = {
          name: 'Procurando el Mérito · PGN 5AM-10 (Convocatoria 242-2026)',
          short_name: 'PGN 5AM-10',
          description: 'Entrenamiento integral offline para Auxiliar Administrativo 5AM-10 · Convocatoria 242-2026 PGN.',
          start_url: './',
          display: 'standalone',
          background_color: '#f9f8f5',
          theme_color: '#2d5a43',
          orientation: 'portrait-primary',
          icons: [
            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
          ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const linkEl = document.createElement('link');
        linkEl.rel = 'manifest';
        linkEl.href = manifestURL;
        document.head.appendChild(linkEl);
      } catch (e) {
        // Fallback silencioso en entornos restringidos
      }

      // Registro de Service Worker embebido si el entorno soporta HTTPS/HTTP
      try {
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
          const swCode = `
            const CACHE_NAME = 'pgn-5am10-v2026-cache-v1';
            self.addEventListener('install', (event) => {
              self.skipWaiting();
              event.waitUntil(
                caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']).catch(() => {}))
              );
            });
            self.addEventListener('activate', (event) => {
              event.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', (event) => {
              if (event.request.method !== 'GET') return;
              event.respondWith(
                caches.match(event.request).then((cached) => {
                  const networkFetch = fetch(event.request).then((response) => {
                    if (response && response.status === 200) {
                      const clone = response.clone();
                      caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone)).catch(() => {});
                    }
                    return response;
                  }).catch(() => cached);
                  return cached || networkFetch;
                })
              );
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl)
            .then(() => { swStatusText = 'Service Worker Activo + Caché Offline'; })
            .catch(() => { swStatusText = 'Persistencia LocalStorage Activa (Modo Autónomo)'; });
        }
      } catch (err) {
        swStatusText = 'Persistencia LocalStorage Activa (Modo Autónomo)';
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        const btn = document.getElementById('pwa-install-btn');
        if (btn) btn.classList.remove('hidden');
      });

      function updateOnlineBadge() {
        const dot = document.getElementById('network-dot');
        const txt = document.getElementById('network-text');
        const badge = document.getElementById('network-badge');
        if (!dot || !txt || !badge) return;
        if (navigator.onLine) {
          dot.className = 'w-2 h-2 rounded-full bg-sage';
          txt.textContent = 'Offline Listo';
          badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-medium bg-sageSoft text-sage border border-sage/20';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-terracotta animate-pulse';
          txt.textContent = 'Sin Red · Local';
          badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-medium bg-terracottaSoft text-terracotta border border-terracotta/20';
        }
      }
      window.addEventListener('online', updateOnlineBadge);
      window.addEventListener('offline', updateOnlineBadge);
      setTimeout(updateOnlineBadge, 100);
    })();

    function triggerInstallPrompt() {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        deferredInstallPrompt.userChoice.then(() => {
          deferredInstallPrompt = null;
          const btn = document.getElementById('pwa-install-btn');
          if (btn) btn.classList.add('hidden');
        });
      } else {
        navigateTo('convocatoria');
        showToast('Revisa las instrucciones de instalación manual para Android o iPhone en esta sección.', 'info');
      }
    }

    /* =====================================================================
       2. SISTEMA DE NOTIFICACIONES TOAST Y MODAL PERSONALIZADO
       ===================================================================== */
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colors = type === 'error'
        ? 'bg-terracotta text-white border-terracotta'
        : type === 'info'
        ? 'bg-ink text-white border-ink'
        : 'bg-sage text-white border-sage';
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-editorialLg border text-sm font-medium flex items-center justify-between gap-3 animate-view ${colors}`;
      toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white font-bold px-1">×</button>`;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentElement) toast.remove();
      }, 4200);
    }

    let modalConfirmCallback = null;
    function openConfirmModal(title, bodyText, onConfirm, confirmLabel = 'Confirmar') {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = bodyText;
      const btn = document.getElementById('modal-confirm-btn');
      btn.textContent = confirmLabel;
      modalConfirmCallback = onConfirm;
      btn.onclick = () => {
        closeCustomModal();
        if (typeof modalConfirmCallback === 'function') modalConfirmCallback();
      };
      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function closeCustomModal() {
      document.getElementById('custom-modal').classList.add('hidden');
      modalConfirmCallback = null;
    }

    /* =====================================================================
       3. BASE DE DATOS DE ESTUDIO: 6 MÓDULOS Y 30 CONCEPTOS CLAVE
       ===================================================================== */
    const MODULES_DATA = [
      {
        id: 1,
        shortTitle: 'Eje 1 · Estructura y Funciones PGN',
        title: 'Módulo 1: Estructura PGN, Planta Global y Funciones Misionales (Manual V10)',
        normative: 'Constitución Política Art. 275-278 · D.L. 262/2000 · D.L. 263/2000 Art. 20 · Resolución 211/2026 (Manual V10) · Ley 1952/2019 mod. Ley 2094/2021 · Ley 2220/2022',
        summary: 'La Procuraduría General de la Nación (PGN) es el máximo organismo del Ministerio Público, con autonomía administrativa, financiera y presupuestal. El empleo Auxiliar Administrativo, Código 5AM, Grado 10 (67 vacantes en la Convocatoria 242-2026, asignación básica de $4.966.461), pertenece al Nivel Asistencial y se rige por el sistema de Planta Global (Art. 7 num. 34 D.L. 262/2000), lo que permite ubicar y reubicar el cargo en cualquier dependencia nacional o territorial según las necesidades del servicio.',
        highlights: [
          { label: 'Función Preventiva', text: 'Vigila el actuar público y advierte riesgos de vulneración normativa ANTES de que ocurra el daño, SIN implicar coadministración ni sustituir la competencia del gestor público.' },

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        const today = new Date().toISOString().slice(0, 10);
        const merged = {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          masteredConcepts: parsed.masteredConcepts || {},
          questionHistory: parsed.questionHistory || {},
          behavioralHistory: parsed.behavioralHistory || {},
          calcInputs: { ...DEFAULT_STATE.calcInputs, ...(parsed.calcInputs || {}) }
        };
        if (!merged.dailyProtocol || merged.dailyProtocol.date !== today) {
          merged.dailyProtocol = { date: today, blocks: { b1: false, b2: false, b3: false, b4: false } };
        }
        return merged;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));

        showToast('No se pudo guardar en almacenamiento local (cuota excedida).', 'error');
      }

    /* =====================================================================
       10. CÁLCULO DE MÉTRICAS Y KPIs EN TIEMPO REAL
       ===================================================================== */
    function computeKPIs() {
      const qIds = Object.keys(appState.questionHistory);
      const solvedCount = qIds.length;
      let correctCount = 0;
      let pendingErrors = 0;

      qIds.forEach(id => {
        const rec = appState.questionHistory[id];
        if (rec.isCorrect) correctCount++;
        if (rec.needsReview) pendingErrors++;
      });

      const accuracy = solvedCount > 0 ? Math.round((correctCount / solvedCount) * 100) : 0;
      const masteredCount = Object.values(appState.masteredConcepts).filter(Boolean).length;

      // Progreso por cada uno de los 6 ejes temáticos (50% conceptos + 50% preguntas acertadas del eje)
      const axisProgress = MODULES_DATA.map(mod => {
        const modConceptIds = mod.concepts.map(c => c.id);
        const modMastered = modConceptIds.filter(cid => appState.masteredConcepts[cid]).length;
        const conceptRatio = modConceptIds.length > 0 ? (modMastered / modConceptIds.length) : 0;

        const modQuestions = QUESTIONS_BANK.filter(q => q.axis === mod.id);
        const modCorrect = modQuestions.filter(q => appState.questionHistory[q.id]?.isCorrect).length;
        const questionRatio = modQuestions.length > 0 ? (modCorrect / modQuestions.length) : 0;

        const pct = Math.round((conceptRatio * 50) + (questionRatio * 50));
        return {
          id: mod.id,
          shortTitle: mod.shortTitle,
          modMastered,
          totalConcepts: modConceptIds.length,
          modCorrect,
          totalQuestions: modQuestions.length,
          pct
        };
      });

      return {
        solvedCount,
        correctCount,
        accuracy,
        masteredCount,
        pendingErrors,
        axisProgress
      };
    }

    function formatMMSS(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function setProtocolBlockPreset(minutes, label) {
      if (protocolTimerInterval) clearInterval(protocolTimerInterval);
      protocolTimerRunning = false;

    function toggleProtocolTimer() {
      if (protocolTimerRunning) {
        clearInterval(protocolTimerInterval);
        protocolTimerRunning = false;
        renderActiveSection();
      } else {
        protocolTimerRunning = true;
        protocolTimerInterval = setInterval(() => {
          if (protocolSecondsLeft > 0) {
            protocolSecondsLeft--;
            const el = document.getElementById('protocol-timer-display');
            if (el) el.textContent = formatMMSS(protocolSecondsLeft);
          } else {
            clearInterval(protocolTimerInterval);
            protocolTimerRunning = false;
            showToast(`¡Tiempo completado para ${protocolActiveBlockLabel}!`, 'success');
            renderActiveSection();

      const dateTag = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `pgn-5am10-conv242-respaldo-${dateTag}.json`;

    function handleImportJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (!imported || typeof imported !== 'object') throw new Error('Formato inválido');
          appState = {
            ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
            ...imported,
            masteredConcepts: imported.masteredConcepts || {},
            questionHistory: imported.questionHistory || {},
            behavioralHistory: imported.behavioralHistory || {},
            calcInputs: { ...DEFAULT_STATE.calcInputs, ...(imported.calcInputs || {}) }
          };
          saveState();
          renderActiveSection();
          showToast('Avance restaurado desde el archivo JSON.', 'success');
        } catch (err) {
          showToast('El archivo seleccionado no es un respaldo JSON válido.', 'error');
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    function renderStudyView() {

      const totalMastered = Object.values(appState.masteredConcepts).filter(Boolean).length;

      return `

          ` : ''}

          ${sub === 'flashcards' ? `
            <!-- Visor Interactivo de 18 Flashcards Reversibles -->
            <div class="max-w-3xl mx-auto space-y-5">
              <div class="flex items-center justify-between text-xs font-mono text-inkMuted px-1">
                <span>Tarjeta ${flashcardIndex + 1} de ${FLASHCARDS_DATA.length}</span>

                        ${FLASHCARDS_DATA[flashcardIndex].tag}

                      <span class="text-xs font-mono text-white/80">REVERSO · RESPUESTA AUDITADA</span>
                    </div>
                    <p class="font-serif text-lg sm:text-xl leading-relaxed text-center my-auto py-4">
                      ${FLASHCARDS_DATA[flashcardIndex].back}
                    </p>
                    <div class="text-center text-xs text-white/80 font-medium">
                      Toca para volver a la pregunta ↺
                    </div>

              </div>

              <div class="flex flex-wrap items-center justify-center gap-3">

                  ← Anterior

                <button onclick="flipFlashcard()" class="min-h-[44px] px-5 py-2.5 rounded-xl bg-terracotta text-white text-sm font-semibold hover:bg-terracotta/90 transition">

                </button>
                <button onclick="nextFlashcard()" class="min-h-[44px] px-5 py-2.5 rounded-xl bg-white border border-sandBorder text-sm font-semibold text-ink hover:bg-sandDark transition">

                </button>
              </div>
            </div>
          ` : ''}

          ${sub === 'terms' ? `
            <!-- Tabla Maestra de Términos Perentorios y Límites del Cargo -->

              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div>
                  <h3 class="font-serif text-xl font-semibold text-ink">Tabla Maestra de Términos Perentorios y Límites del Cargo 5AM-10</h3>
                  <p class="text-xs text-inkMuted">Referencia rápida de plazos legales obligatorios y fronteras funcionales del nivel asistencial.</p>
                </div>
                <input type="text" value="${termsSearchQuery}" oninput="updateTermsSearch(this.value)" placeholder="Filtrar plazo o norma (ej. 48, tutela, 1755)..." class="min-h-[44px] px-3.5 py-2 rounded-xl border border-sandBorder bg-sand text-sm text-ink w-full sm:w-72 focus:outline-none focus:border-sage" />
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b-2 border-sandBorder text-xs uppercase tracking-wider text-inkMuted bg-sand/60">
                      <th class="py-3 px-4 font-semibold">Término / Límite</th>
                      <th class="py-3 px-4 font-semibold">Actuación / Regla</th>
                      <th class="py-3 px-4 font-semibold">Fundamento Normativo</th>
                      <th class="py-3 px-4 font-semibold">Alcance Auxiliar 5AM-10</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-sandBorder text-sm">
                    ${MASTER_TERMS_DATA.filter(row => {
                      if (!termsSearchQuery.trim()) return true;
                      const q = termsSearchQuery.toLowerCase();
                      return row.term.toLowerCase().includes(q) || row.subject.toLowerCase().includes(q) || row.norm.toLowerCase().includes(q) || row.roleLimit.toLowerCase().includes(q);
                    }).map(row => `
                      <tr class="hover:bg-sand/40 transition">
                        <td class="py-3.5 px-4 font-mono font-bold text-terracotta whitespace-nowrap">${row.term}</td>
                        <td class="py-3.5 px-4 font-medium text-ink">${row.subject}</td>
                        <td class="py-3.5 px-4 font-mono text-xs text-sage">${row.norm}</td>
                        <td class="py-3.5 px-4 text-inkMuted text-xs leading-relaxed">${row.roleLimit}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    /* =====================================================================
       14. SECCIÓN 3: BANCO AUDITADO DE 80 PREGUNTAS
       ===================================================================== */
    let bankFilterState = {
      axis: 'all',
      type: 'all',
      status: 'all',
      search: ''
    };
    let bankCurrentPage = 1;
    const BANK_PAGE_SIZE = 10;

    function updateBankFilter(key, val) {
      bankFilterState[key] = val;
      bankCurrentPage = 1;
      renderActiveSection();
    }

    function setBankPage(page) {
      bankCurrentPage = page;
      renderActiveSection();
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    function answerBankQuestion(qId, letter) {
      const q = QUESTIONS_BANK.find(item => item.id === qId);
      if (!q) return;
      const isCorrect = q.answer === letter;
      const prev = appState.questionHistory[qId];
      appState.questionHistory[qId] = {
        selected: letter,
        isCorrect,
        attempts: (prev ? prev.attempts : 0) + 1,
        needsReview: !isCorrect
      };
      saveState();
      renderActiveSection();
    }

    function retryBankQuestion(qId) {
      if (appState.questionHistory[qId]) {
        delete appState.questionHistory[qId].selected;
        delete appState.questionHistory[qId].isCorrect;
        saveState();
        renderActiveSection();
      }
    }

    function renderBankView() {
      const dist = getBankDistribution();

      const filtered = QUESTIONS_BANK.filter(q => {
        if (bankFilterState.axis !== 'all' && q.axis !== Number(bankFilterState.axis)) return false;
        if (bankFilterState.type !== 'all' && q.type !== bankFilterState.type) return false;
        const rec = appState.questionHistory[q.id];
        const hasAnswered = rec && rec.selected !== undefined;
        if (bankFilterState.status === 'unanswered' && hasAnswered) return false;
        if (bankFilterState.status === 'failed' && !(rec && rec.needsReview)) return false;
        if (bankFilterState.status === 'correct' && !(hasAnswered && rec.isCorrect)) return false;
        if (bankFilterState.search.trim()) {
          const s = bankFilterState.search.toLowerCase();
          if (!q.stem.toLowerCase().includes(s) && !q.explanation.toLowerCase().includes(s)) return false;
        }
        return true;
      });

      const totalPages = Math.max(1, Math.ceil(filtered.length / BANK_PAGE_SIZE));
      if (bankCurrentPage > totalPages) bankCurrentPage = totalPages;
      const startIdx = (bankCurrentPage - 1) * BANK_PAGE_SIZE;
      const pageItems = filtered.slice(startIdx, startIdx + BANK_PAGE_SIZE);

      return `
        <div class="space-y-6 animate-view">
          <!-- Encabezado y Auditoría de Equilibrio A/B/C/D -->
          <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div>
                <h2 class="font-serif text-2xl font-semibold text-ink">Banco Auditado de 80 Casos y Preguntas PGN</h2>
                <p class="text-sm text-inkMuted mt-1">
                  Casos situacionales y normativos verificados con retroalimentación jurídica y clave oficial Tipo I, Tipo II (1-2-3-4) y Tipo III (PORQUE).
                </p>
              </div>
              <div class="inline-flex flex-wrap items-center gap-2 px-3.5 py-2 rounded-xl bg-sand border border-sandBorder text-xs font-mono">
                <span class="font-semibold text-ink">Balance Claves:</span>
                <span class="px-2 py-0.5 rounded bg-white border border-sandBorder">A: ${dist.A}</span>
                <span class="px-2 py-0.5 rounded bg-white border border-sandBorder">B: ${dist.B}</span>
                <span class="px-2 py-0.5 rounded bg-white border border-sandBorder">C: ${dist.C}</span>
                <span class="px-2 py-0.5 rounded bg-white border border-sandBorder">D: ${dist.D}</span>
              </div>
            </div>

            <!-- Barra de Filtros -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mt-5 pt-4 border-t border-sandBorder">
              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-inkMuted mb-1">Eje Temático</label>
                <select onchange="updateBankFilter('axis', this.value)" class="min-h-[44px] w-full px-3 py-2 rounded-xl border border-sandBorder bg-sand text-sm text-ink">
                  <option value="all" ${bankFilterState.axis === 'all' ? 'selected' : ''}>Todos los 6 Ejes (80)</option>
                  ${MODULES_DATA.map(m => `<option value="${m.id}" ${Number(bankFilterState.axis) === m.id ? 'selected' : ''}>${m.shortTitle}</option>`).join('')}
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-inkMuted mb-1">Tipología Oficial PGN</label>
                <select onchange="updateBankFilter('type', this.value)" class="min-h-[44px] w-full px-3 py-2 rounded-xl border border-sandBorder bg-sand text-sm text-ink">
                  <option value="all" ${bankFilterState.type === 'all' ? 'selected' : ''}>Todas las Tipologías</option>
                  <option value="Tipo I" ${bankFilterState.type === 'Tipo I' ? 'selected' : ''}>Tipo I (Situacional / Única)</option>
                  <option value="Tipo II" ${bankFilterState.type === 'Tipo II' ? 'selected' : ''}>Tipo II (Múltiple 1-2-3-4)</option>
                  <option value="Tipo III" ${bankFilterState.type === 'Tipo III' ? 'selected' : ''}>Tipo III (Análisis PORQUE)</option>
                  <option value="Aptitud Verbal" ${bankFilterState.type === 'Aptitud Verbal' ? 'selected' : ''}>Aptitud Verbal / Lectura</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-inkMuted mb-1">Estado de Estudio</label>
                <select onchange="updateBankFilter('status', this.value)" class="min-h-[44px] w-full px-3 py-2 rounded-xl border border-sandBorder bg-sand text-sm text-ink">
                  <option value="all" ${bankFilterState.status === 'all' ? 'selected' : ''}>Todas (${QUESTIONS_BANK.length})</option>
                  <option value="unanswered" ${bankFilterState.status === 'unanswered' ? 'selected' : ''}>Sin responder</option>
                  <option value="failed" ${bankFilterState.status === 'failed' ? 'selected' : ''}>Solo falladas / pendientes</option>
                  <option value="correct" ${bankFilterState.status === 'correct' ? 'selected' : ''}>Acertadas</option>
                </select>
              </div>

              <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-inkMuted mb-1">Buscar palabra clave</label>
                <input type="text" value="${bankFilterState.search}" oninput="updateBankFilter('search', this.value)" placeholder="Ej. tutela, foliación, BUSCARV..." class="min-h-[44px] w-full px-3 py-2 rounded-xl border border-sandBorder bg-sand text-sm text-ink" />
              </div>
            </div>

            <div class="flex items-center justify-between text-xs text-inkMuted mt-3">
              <span>Mostrando <strong>${filtered.length}</strong> preguntas filtradas (Página ${bankCurrentPage} de ${totalPages})</span>
              ${(bankFilterState.axis !== 'all' || bankFilterState.type !== 'all' || bankFilterState.status !== 'all' || bankFilterState.search) ? `
                <button onclick="bankFilterState={axis:'all',type:'all',status:'all',search:''};bankCurrentPage=1;renderActiveSection();" class="text-terracotta font-semibold hover:underline">
                  Limpiar filtros
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Listado de Preguntas -->
          ${pageItems.length === 0 ? `
            <div class="bg-white rounded-2xl border border-sandBorder p-10 text-center shadow-editorial">
              <p class="font-serif text-lg text-ink">No hay preguntas que coincidan con los filtros actuales.</p>
              <button onclick="bankFilterState={axis:'all',type:'all',status:'all',search:''};bankCurrentPage=1;renderActiveSection();" class="mt-4 min-h-[44px] px-4 py-2 rounded-xl bg-sage text-white text-sm font-semibold">
                Mostrar las 80 preguntas
              </button>
            </div>
          ` : `
            <div class="space-y-5">
              ${pageItems.map(q => {
                const rec = appState.questionHistory[q.id];
                const isAnswered = rec && rec.selected !== undefined;
                const letters = ['A', 'B', 'C', 'D'];
                const modObj = MODULES_DATA.find(m => m.id === q.axis);

                return `
                  <article class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-4">
                    <!-- Metadatos del Caso -->
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="px-2.5 py-1 rounded-lg bg-ink text-white font-mono text-xs font-bold">
                          Caso #${q.id}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg bg-sand text-inkMuted text-xs font-medium border border-sandBorder">
                          ${modObj ? modObj.shortTitle : 'Eje ' + q.axis}
                        </span>
                        <span class="px-2.5 py-1 rounded-lg bg-terracottaSoft text-terracotta text-xs font-semibold">
                          ${q.type}
                        </span>
                      </div>
                      <div>
                        ${isAnswered ? (
                          rec.isCorrect
                            ? '<span class="px-3 py-1 rounded-full bg-sageSoft text-sage text-xs font-bold">✓ Acertada</span>'
                            : '<span class="px-3 py-1 rounded-full bg-terracottaSoft text-terracotta text-xs font-bold">✗ Fallada</span>'
                        ) : (
                          rec && rec.needsReview
                            ? '<span class="px-3 py-1 rounded-full bg-terracottaSoft text-terracotta text-xs font-semibold">En reintento</span>'
                            : '<span class="px-3 py-1 rounded-full bg-sand text-inkMuted text-xs">Sin responder</span>'
                        )}
                      </div>
                    </div>

                    <!-- Enunciado Editorial Serif -->
                    <div class="font-serif text-base sm:text-lg text-ink leading-relaxed whitespace-pre-line bg-sand/50 p-4 rounded-xl border border-sandBorder/70">
                      ${q.stem}
                    </div>

                    <!-- 4 Opciones Táctiles -->
                    <div class="space-y-2.5">
                      ${q.options.map((optText, idx) => {
                        const letter = letters[idx];
                        let btnStyle = 'bg-white border-sandBorder text-ink hover:bg-sand hover:border-ink/30';
                        if (isAnswered) {
                          if (letter === q.answer) {
                            btnStyle = 'bg-sageSoft border-sage text-ink font-semibold ring-1 ring-sage';
                          } else if (letter === rec.selected && letter !== q.answer) {
                            btnStyle = 'bg-terracottaSoft border-terracotta text-ink ring-1 ring-terracotta';
                          } else {
                            btnStyle = 'bg-white/60 border-sandBorder text-inkMuted opacity-75';
                          }
                        }
                        return `
                          <button ${isAnswered ? 'disabled' : ''} onclick="answerBankQuestion(${q.id}, '${letter}')" class="w-full min-h-[48px] p-3.5 rounded-xl border text-left text-sm leading-relaxed transition flex items-start justify-between gap-3 ${btnStyle}">
                            <span>${optText}</span>
                            ${isAnswered && letter === q.answer ? '<span class="text-sage font-bold shrink-0">✓ Correcta</span>' : ''}
                            ${isAnswered && letter === rec.selected && letter !== q.answer ? '<span class="text-terracotta font-bold shrink-0">✗ Tu elección</span>' : ''}
                          </button>
                        `;
                      }).join('')}
                    </div>

                    <!-- Retroalimentación Jurídica / Técnica -->
                    ${isAnswered ? `
                      <div class="p-4 rounded-xl ${rec.isCorrect ? 'bg-sageSoft/70 border border-sage/30' : 'bg-terracottaSoft/70 border border-terracotta/30'} space-y-2 animate-view">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                          <span class="text-xs font-bold uppercase tracking-wider ${rec.isCorrect ? 'text-sage' : 'text-terracotta'}">
                            Fundamentación Jurídica y Técnica (Clave: ${q.answer})
                          </span>
                          <button onclick="retryBankQuestion(${q.id})" class="min-h-[36px] px-3 py-1 rounded-lg bg-white border border-sandBorder text-xs font-semibold text-ink hover:bg-sand transition">
                            ↻ Reintentar caso
                          </button>
                        </div>
                        <p class="text-sm text-ink leading-relaxed">${q.explanation}</p>
                      </div>
                    ` : ''}
                  </article>
                `;
              }).join('')}
            </div>

            <!-- Paginación -->
            ${totalPages > 1 ? `
              <div class="flex flex-wrap items-center justify-center gap-2 pt-2">
                <button ${bankCurrentPage === 1 ? 'disabled' : ''} onclick="setBankPage(${bankCurrentPage - 1})" class="min-h-[44px] px-4 py-2 rounded-xl bg-white border border-sandBorder text-sm font-semibold disabled:opacity-40">
                  ← Anterior
                </button>
                ${Array.from({ length: totalPages }, (_, i) => i + 1).map(p => `
                  <button onclick="setBankPage(${p})" class="min-h-[44px] min-w-[44px] px-3 py-2 rounded-xl text-sm font-mono font-semibold border transition ${p === bankCurrentPage ? 'bg-sage text-white border-sage' : 'bg-white text-ink border-sandBorder hover:bg-sand'}">
                    ${p}
                  </button>
                `).join('')}
                <button ${bankCurrentPage === totalPages ? 'disabled' : ''} onclick="setBankPage(${bankCurrentPage + 1})" class="min-h-[44px] px-4 py-2 rounded-xl bg-white border border-sandBorder text-sm font-semibold disabled:opacity-40">
                  Siguiente →
                </button>
              </div>
            ` : ''}
          `}
        </div>
      `;
    }

    /* =====================================================================
       15. SECCIÓN 4: ENTRENADOR DE PRUEBA COMPORTAMENTAL (20 PARES IPSATIVOS)
       ===================================================================== */
    let behavioralFilterPart = 'all'; // 'all' | 'I' | 'II'

    function setBehavioralFilter(part) {
      behavioralFilterPart = part;
      renderActiveSection();
    }

    function answerBehavioralPair(pairId, optionLetter) {
      const pair = BEHAVIORAL_PAIRS.find(p => p.id === pairId);
      if (!pair) return;
      appState.behavioralHistory[pairId] = {
        selected: optionLetter,
        isRecommended: optionLetter === pair.recommended
      };
      saveState();
      renderActiveSection();
    }

    function renderBehavioralView() {
      const filteredPairs = BEHAVIORAL_PAIRS.filter(p => behavioralFilterPart === 'all' || p.part === behavioralFilterPart);
      const answeredTotal = Object.keys(appState.behavioralHistory).length;
      const alignedTotal = Object.values(appState.behavioralHistory).filter(v => v.isRecommended).length;

      const optionsMeta = [
        { code: 'A', label: 'A (3 - 0)', desc: '3 pts Izq · 0 pts Der' },
        { code: 'B', label: 'B (0 - 3)', desc: '0 pts Izq · 3 pts Der' },
        { code: 'C', label: 'C (2 - 1)', desc: '2 pts Izq · 1 pt Der' },
        { code: 'D', label: 'D (1 - 2)', desc: '1 pt Izq · 2 pts Der' }
      ];

      return `
        <div class="space-y-6 animate-view">
          <!-- Cabecera Explicativa Metodología Ipsativa PGN -->
          <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-4">
            <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sageSoft text-sage text-xs font-semibold mb-2">
                  <span>Peso: 20% Clasificatoria</span>
                  <span>·</span>
                  <span>Manual V10 (5 Competencias)</span>
                </div>
                <h2 class="font-serif text-2xl font-semibold text-ink">Entrenador de Prueba Comportamental (20 Pares Ipsativos)</h2>
                <p class="text-sm text-inkMuted mt-1">
                  Formato oficial de elección forzada de la PGN: distribuye exactamente <strong>3 puntos</strong> entre dos conductas enfrentadas (Izquierda vs. Derecha).
                </p>
              </div>
              <div class="px-4 py-3 rounded-xl bg-sand border border-sandBorder text-xs font-mono shrink-0">
                <div>Completados: <strong>${answeredTotal} / 20</strong></div>
                <div class="text-sage mt-0.5">Alineación Perfil 5AM-10: <strong>${alignedTotal} / ${answeredTotal || 0}</strong></div>
              </div>
            </div>

            <!-- Guía Visual Parte I vs Parte II -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
              <div class="p-3.5 rounded-xl bg-sageSoft/60 border border-sage/25 text-xs">
                <div class="font-bold text-sage uppercase tracking-wider mb-1">Parte I (Ítems 1 al 10) · Frases Positivas</div>
                <p class="text-ink leading-relaxed">
                  Se enfrentan dos conductas deseables. Otorga <strong>mayor puntaje (3 o 2)</strong> a la conducta con la que <strong>MÁS te identificas</strong> según las competencias del cargo.
                </p>
              </div>
              <div class="p-3.5 rounded-xl bg-terracottaSoft/60 border border-terracotta/25 text-xs">
                <div class="font-bold text-terracotta uppercase tracking-wider mb-1">Parte II (Ítems 11 al 20) · Frases Negativas</div>
                <p class="text-ink leading-relaxed">
                  Se enfrentan dos conductas indeseables. Otorga <strong>mayor puntaje (3 o 2)</strong> al comportamiento que consideras <strong>MÁS INACEPTABLE</strong> o con el que <strong>MENOS te identificas</strong>.
                </p>
              </div>
            </div>
            <!-- Filtros Parte I / Parte II -->
            <div class="flex flex-wrap items-center gap-2 pt-1">
              <button onclick="setBehavioralFilter('all')" class="min-h-[40px] px-4 py-2 rounded-xl text-xs font-semibold border transition ${behavioralFilterPart === 'all' ? 'bg-sage text-white border-sage' : 'bg-white text-ink border-sandBorder hover:bg-sand'}">
                Todos (20)
              </button>
              <button onclick="setBehavioralFilter('I')" class="min-h-[40px] px-4 py-2 rounded-xl text-xs font-semibold border transition ${behavioralFilterPart === 'I' ? 'bg-sage text-white border-sage' : 'bg-white text-ink border-sandBorder hover:bg-sand'}">
                Parte I · Positivas (10)
              </button>
              <button onclick="setBehavioralFilter('II')" class="min-h-[40px] px-4 py-2 rounded-xl text-xs font-semibold border transition ${behavioralFilterPart === 'II' ? 'bg-terracotta text-white border-terracotta' : 'bg-white text-ink border-sandBorder hover:bg-sand'}">
                Parte II · Negativas (10)
              </button>
            </div>
          </div>

          <!-- Lista de Pares Ipsativos -->
          <div class="space-y-4">
            ${filteredPairs.map(pair => {
              const rec = appState.behavioralHistory[pair.id];
              const isAnswered = rec && rec.selected;
              return `
                <article class="bg-white rounded-2xl border border-sandBorder p-5 sm:p-6 shadow-editorial space-y-4">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="px-2.5 py-1 rounded-lg bg-sandDark text-ink font-mono text-xs font-bold">
                        Ítem #${pair.id}
                      </span>
                      <span class="px-2.5 py-1 rounded-lg ${pair.part === 'I' ? 'bg-sageSoft text-sage' : 'bg-terracottaSoft text-terracotta'} text-xs font-semibold">
                        Parte ${pair.part} · ${pair.part === 'I' ? 'Frases Positivas' : 'Frases Negativas'}
                      </span>
                      <span class="px-2.5 py-1 rounded-lg bg-sand text-inkMuted text-xs font-medium">
                        ${pair.competency}
                      </span>
                    </div>
                    ${isAnswered ? (
                      rec.isRecommended
                        ? '<span class="px-3 py-1 rounded-full bg-sageSoft text-sage text-xs font-bold">✓ Alineado al Perfil 5AM-10</span>'
                        : '<span class="px-3 py-1 rounded-full bg-terracottaSoft text-terracotta text-xs font-bold">Revisar criterio (' + pair.recommended + ')</span>'
                    ) : '<span class="px-3 py-1 rounded-full bg-sand text-inkMuted text-xs">Pendiente</span>'}
                  </div>

                  <!-- Columnas Enfrentadas Izquierda vs Derecha -->
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div class="p-4 rounded-xl bg-sand/60 border border-sandBorder">
                      <div class="text-[11px] font-mono font-bold uppercase tracking-wider text-inkMuted mb-1.5">Columna Izquierda</div>
                      <p class="font-serif text-sm sm:text-base text-ink leading-relaxed">${pair.left}</p>
                    </div>
                    <div class="p-4 rounded-xl bg-sand/60 border border-sandBorder">
                      <div class="text-[11px] font-mono font-bold uppercase tracking-wider text-inkMuted mb-1.5">Columna Derecha</div>
                      <p class="font-serif text-sm sm:text-base text-ink leading-relaxed">${pair.right}</p>
                    </div>
                  </div>

                  <!-- Botones A / B / C / D -->
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                    ${optionsMeta.map(opt => {
                      let btnCls = 'bg-white border-sandBorder text-ink hover:bg-sand';
                      if (isAnswered) {
                        if (opt.code === pair.recommended) {
                          btnCls = 'bg-sageSoft border-sage text-ink ring-1 ring-sage font-semibold';
                        } else if (opt.code === rec.selected && opt.code !== pair.recommended) {
                          btnCls = 'bg-terracottaSoft border-terracotta text-ink ring-1 ring-terracotta';
                        } else {
                          btnCls = 'bg-white/60 border-sandBorder text-inkMuted opacity-75';
                        }
                      }
                      return `
                        <button onclick="answerBehavioralPair(${pair.id}, '${opt.code}')" class="min-h-[52px] p-3 rounded-xl border text-left transition ${btnCls}">
                          <div class="font-mono text-xs font-bold">${opt.label}</div>
                          <div class="text-[11px] text-inkMuted mt-0.5">${opt.desc}</div>
                        </button>
                      `;
                    }).join('')}
                  </div>

                  ${isAnswered ? `
                    <div class="p-4 rounded-xl ${rec.isRecommended ? 'bg-sageSoft/60 border border-sage/25' : 'bg-terracottaSoft/60 border border-terracotta/25'} text-sm text-ink leading-relaxed animate-view">
                      <strong class="${rec.isRecommended ? 'text-sage' : 'text-terracotta'}">Criterio del Diccionario PGN (Clave ${pair.recommended}):</strong> ${pair.explanation}
                    </div>
                  ` : ''}
                </article>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    /* =====================================================================
       16. SECCIÓN 5: SIMULACRO CRONOMETRADO Y CALCULADORA DE PUNTAJE
       ===================================================================== */
    let simConfig = { count: 20, axis: 'all', minutes: 35 };
    let simSession = null;
    let simTimerInterval = null;
    let calcScores = { conocimientos: 75, comportamental: 78, antecedentes: 65 };

    function setSimConfig(key, val) {
      simConfig[key] = val;
      if (key === 'count') {
        simConfig.minutes = val === 20 ? 35 : val === 40 ? 70 : 140;
      }
      renderActiveSection();
    }

    function startSimulator() {
      let pool = QUESTIONS_BANK.filter(q => simConfig.axis === 'all' || String(q.axis) === String(simConfig.axis));
      pool = [...pool];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const selected = pool.slice(0, Math.min(simConfig.count, pool.length));
      if (simTimerInterval) clearInterval(simTimerInterval);
      simSession = {
        questions: selected,
        answers: {},
        currentIndex: 0,
        secondsLeft: simConfig.minutes * 60,
        totalSeconds: simConfig.minutes * 60,
        finished: false
      };
      simTimerInterval = setInterval(() => {
        if (!simSession || simSession.finished) {
          clearInterval(simTimerInterval);
          return;
        }
        simSession.secondsLeft--;
        const timerEl = document.getElementById('sim-timer-display');
        if (timerEl) timerEl.textContent = formatMMSS(Math.max(0, simSession.secondsLeft));
        if (simSession.secondsLeft <= 0) {
          finishSimulator(true);
        }
      }, 1000);
      renderActiveSection();
    }

    function selectSimAnswer(qId, letter) {
      if (!simSession || simSession.finished) return;
      simSession.answers[qId] = letter;
      renderActiveSection();
    }

    function goToSimQuestion(idx) {
      if (!simSession) return;
      simSession.currentIndex = Math.max(0, Math.min(simSession.questions.length - 1, idx));
      renderActiveSection();
    }

    function finishSimulator(autoExpired = false) {
      if (!simSession || simSession.finished) return;
      if (simTimerInterval) clearInterval(simTimerInterval);
      simSession.finished = true;

      let correct = 0;
      simSession.questions.forEach(q => {
        const chosen = simSession.answers[q.id];
        if (chosen === q.answer) correct++;
        if (chosen) {
          appState.questionHistory[q.id] = {
            selected: chosen,
            isCorrect: chosen === q.answer,
            needsReview: chosen !== q.answer
          };
        }
      });

      const score100 = Number(((correct / simSession.questions.length) * 100).toFixed(2));
      const passed = score100 >= 65;
      const elapsedSec = simSession.totalSeconds - Math.max(0, simSession.secondsLeft);

      appState.examHistory.unshift({
        date: new Date().toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' }),
        total: simSession.questions.length,
        correct,
        score100,
        passed,
        durationMin: Math.max(1, Math.round(elapsedSec / 60))
      });
      if (appState.examHistory.length > 20) appState.examHistory.pop();
      calcScores.conocimientos = Math.round(score100);
      saveState();

      showToast(
        autoExpired
          ? `Tiempo agotado. Puntaje: ${score100}/100`
          : `Simulacro finalizado: ${score100}/100 (${passed ? 'Aprobado' : 'Eliminado'})`,
        passed ? 'success' : 'error'
      );
      renderActiveSection();
    }

    function resetSimulator() {
      if (simTimerInterval) clearInterval(simTimerInterval);
      simSession = null;
      renderActiveSection();
    }

    function updateCalcScore(field, val) {
      const num = Math.max(0, Math.min(100, Number(val) || 0));
      calcScores[field] = num;
      renderActiveSection();
    }

    function renderSimulatorView() {
      const ponderado = (calcScores.conocimientos * 0.60) + (calcScores.comportamental * 0.20) + (calcScores.antecedentes * 0.20);
      const pasaConoc = calcScores.conocimientos >= 65;
      const pasaLista = pasaConoc && ponderado >= 70;

      if (!simSession) {
        return `
          <div class="space-y-6 animate-view">
            <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-5">
              <div>
                <span class="px-3 py-1 rounded-full bg-terracottaSoft text-terracotta text-xs font-semibold">
                  Prueba Eliminatoria · Corte mínimo 65.00 / 100
                </span>
                <h2 class="font-serif text-2xl font-semibold text-ink mt-2">Simulacro Cronometrado Tipo PGN</h2>
                <p class="text-sm text-inkMuted mt-1">
                  Entrena bajo presión de tiempo con preguntas aleatorizadas Tipo I, Tipo II y Tipo III. Tus respuestas actualizarán automáticamente tu historial y radar de errores.
                </p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-4 rounded-xl bg-sand/60 border border-sandBorder space-y-2.5">
                  <div class="text-xs font-bold uppercase tracking-wider text-inkMuted">1. Extensión y Tiempo</div>
                  <div class="grid grid-cols-3 gap-2">
                    ${[20, 40, 80].map(cnt => `
                      <button onclick="setSimConfig('count', ${cnt})" class="min-h-[48px] px-3 py-2 rounded-xl border text-xs font-semibold transition ${simConfig.count === cnt ? 'bg-sage text-white border-sage' : 'bg-white text-ink border-sandBorder hover:bg-sand'}">
                        ${cnt} Preg.<br/><span class="font-mono opacity-80">${cnt === 20 ? '35m' : cnt === 40 ? '70m' : '140m'}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>

                <div class="p-4 rounded-xl bg-sand/60 border border-sandBorder space-y-2.5">
                  <div class="text-xs font-bold uppercase tracking-wider text-inkMuted">2. Eje Temático</div>
                  <select onchange="setSimConfig('axis', this.value)" class="w-full min-h-[48px] px-3 py-2 rounded-xl border border-sandBorder bg-white text-sm text-ink">
                    <option value="all" ${simConfig.axis === 'all' ? 'selected' : ''}>Todos los ejes (Mixto oficial 30% / 70%)</option>
                    ${MODULES_DATA.map(m => `
                      <option value="${m.id}" ${String(simConfig.axis) === String(m.id) ? 'selected' : ''}>Eje ${m.id}: ${m.title}</option>
                    `).join('')}
                  </select>
                </div>
              </div>

              <button onclick="startSimulator()" class="w-full sm:w-auto min-h-[48px] px-6 py-3 rounded-xl bg-sage text-white text-sm font-semibold hover:bg-sage/90 transition shadow-sm">
                Iniciar Simulacro Ahora →
              </button>
            </div>

            <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <h3 class="font-serif text-xl font-semibold text-ink">Calculadora de Lista de Elegibles (Art. 216 D.L. 262/2000)</h3>
                  <p class="text-xs text-inkMuted mt-0.5">Proyecta tu puntaje final ponderado: Conocimientos (60%) + Comportamental (20%) + Antecedentes (20%).</p>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-bold ${pasaLista ? 'bg-sageSoft text-sage' : 'bg-terracottaSoft text-terracotta'}">
                  ${!pasaConoc ? 'Eliminado en Conocimientos (<65)' : (pasaLista ? '✓ Supera umbral 70.00%' : 'No alcanza umbral 70.00%')}
                </span>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="p-3.5 rounded-xl bg-sand/50 border border-sandBorder">
                  <label class="block text-xs font-semibold text-ink mb-1">Conocimientos (60% · mín. 65)</label>
                  <input type="number" min="0" max="100" value="${calcScores.conocimientos}" oninput="updateCalcScore('conocimientos', this.value)" class="w-full min-h-[44px] px-3 rounded-lg border border-sandBorder bg-white font-mono text-sm font-bold text-ink" />
                </div>
                <div class="p-3.5 rounded-xl bg-sand/50 border border-sandBorder">
                  <label class="block text-xs font-semibold text-ink mb-1">Comportamental (20%)</label>
                  <input type="number" min="0" max="100" value="${calcScores.comportamental}" oninput="updateCalcScore('comportamental', this.value)" class="w-full min-h-[44px] px-3 rounded-lg border border-sandBorder bg-white font-mono text-sm font-bold text-ink" />
                </div>
                <div class="p-3.5 rounded-xl bg-sand/50 border border-sandBorder">
                  <label class="block text-xs font-semibold text-ink mb-1">Antecedentes (20%)</label>
                  <input type="number" min="0" max="100" value="${calcScores.antecedentes}" oninput="updateCalcScore('antecedentes', this.value)" class="w-full min-h-[44px] px-3 rounded-lg border border-sandBorder bg-white font-mono text-sm font-bold text-ink" />
                </div>
              </div>

              <div class="p-4 rounded-xl bg-ink text-white flex flex-wrap items-center justify-between gap-3">
                <span class="text-sm">Puntaje Final Ponderado Estimado:</span>
                <span class="font-mono text-2xl font-bold ${pasaLista ? 'text-emerald-300' : 'text-amber-300'}">${ponderado.toFixed(2)} / 100.00</span>
              </div>
            </div>

            ${appState.examHistory.length > 0 ? `
              <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-3">
                <h3 class="font-serif text-lg font-semibold text-ink">Historial de Intentos Recientes</h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-left text-xs">
                    <thead>
                      <tr class="border-b border-sandBorder text-inkMuted">
                        <th class="py-2 pr-3">Fecha</th>
                        <th class="py-2 pr-3">Aciertos</th>
                        <th class="py-2 pr-3">Puntaje / 100</th>
                        <th class="py-2 pr-3">Duración</th>
                        <th class="py-2">Estado</th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-sandBorder/60">
                      ${appState.examHistory.map(h => `
                        <tr>
                          <td class="py-2.5 pr-3 font-mono">${h.date}</td>
                          <td class="py-2.5 pr-3 font-mono">${h.correct} / ${h.total}</td>
                          <td class="py-2.5 pr-3 font-mono font-bold">${h.score100}</td>
                          <td class="py-2.5 pr-3 font-mono">${h.durationMin} min</td>
                          <td class="py-2.5">
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-bold ${h.passed ? 'bg-sageSoft text-sage' : 'bg-terracottaSoft text-terracotta'}">
                              ${h.passed ? 'Aprobado (≥65)' : 'Eliminado (<65)'}
                            </span>
                          </td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      if (simSession.finished) {
        const correct = simSession.questions.filter(q => simSession.answers[q.id] === q.answer).length;
        const score100 = Number(((correct / simSession.questions.length) * 100).toFixed(2));
        const passed = score100 >= 65;

        return `
          <div class="space-y-6 animate-view">
            <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${passed ? 'bg-sageSoft text-sage' : 'bg-terracottaSoft text-terracotta'}">
                    ${passed ? '✓ SUPERA CORTE ELIMINATORIO (≥ 65.00)' : '✗ NO SUPERA CORTE ELIMINATORIO (< 65.00)'}
                  </span>
                  <h2 class="font-serif text-2xl font-semibold text-ink mt-2">Resultado del Simulacro</h2>
                </div>
                <div class="text-right font-mono">
                  <div class="text-3xl font-bold ${passed ? 'text-sage' : 'text-terracotta'}">${score100} / 100</div>
                  <div class="text-xs text-inkMuted">${correct} de ${simSession.questions.length} aciertos</div>
                </div>
              </div>
              <div class="flex flex-wrap gap-3">
                <button onclick="resetSimulator()" class="min-h-[44px] px-5 py-2 rounded-xl bg-sage text-white text-sm font-semibold hover:bg-sage/90 transition">
                  Configurar Nuevo Simulacro
                </button>
                <button onclick="navigateTo('bank')" class="min-h-[44px] px-5 py-2 rounded-xl border border-sandBorder text-sm font-semibold text-ink hover:bg-sand transition">
                  Ir al Banco Completo
                </button>
              </div>
            </div>

            <div class="space-y-4">
              ${simSession.questions.map((q, idx) => {
                const chosen = simSession.answers[q.id];
                const isOk = chosen === q.answer;
                return `
                  <div class="bg-white rounded-2xl border ${isOk ? 'border-sage/40' : 'border-terracotta/40'} p-5 shadow-editorial space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2">
                      <span class="font-mono text-xs font-bold text-inkMuted">Pregunta ${idx + 1} · Caso #${q.id} (${q.type})</span>
                      <span class="px-2.5 py-1 rounded-full text-xs font-bold ${isOk ? 'bg-sageSoft text-sage' : 'bg-terracottaSoft text-terracotta'}">
                        ${isOk ? '✓ Acertada' : (chosen ? '✗ Elegiste ' + chosen + ' (Clave: ' + q.answer + ')' : 'Sin responder (Clave: ' + q.answer + ')')}
                      </span>
                    </div>
                    <p class="font-serif text-sm sm:text-base text-ink whitespace-pre-line">${q.stem}</p>
                    <p class="text-xs sm:text-sm text-inkMuted bg-sand/60 p-3 rounded-xl border border-sandBorder">
                      <strong class="text-ink">Fundamento:</strong> ${q.explanation}
                    </p>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      const q = simSession.questions[simSession.currentIndex];
      const chosen = simSession.answers[q.id];
      const answeredCount = Object.keys(simSession.answers).length;
      const letters = ['A', 'B', 'C', 'D'];

      return `
        <div class="space-y-5 animate-view">
          <div class="bg-white rounded-2xl border border-sandBorder p-4 sm:p-5 shadow-editorial flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <span class="px-3 py-1 rounded-xl bg-ink text-white font-mono text-xs font-bold">
                ${simSession.currentIndex + 1} / ${simSession.questions.length}
              </span>
              <span class="text-xs text-inkMuted font-medium">Respondidas: <strong>${answeredCount}</strong></span>
            </div>
            <div class="flex items-center gap-3">
              <div class="px-3 py-1.5 rounded-xl bg-terracottaSoft text-terracotta font-mono text-sm font-bold">
                ⏱ <span id="sim-timer-display">${formatMMSS(simSession.secondsLeft)}</span>
              </div>
              <button onclick="finishSimulator(false)" class="min-h-[40px] px-4 py-1.5 rounded-xl bg-terracotta text-white text-xs font-semibold hover:bg-terracotta/90 transition">
                Finalizar y Calificar
              </button>
            </div>
          </div>

          <div class="flex flex-wrap gap-1.5">
            ${simSession.questions.map((item, idx) => {
              const isCurr = idx === simSession.currentIndex;
              const isAns = !!simSession.answers[item.id];
              return `
                <button onclick="goToSimQuestion(${idx})" class="w-9 h-9 rounded-lg font-mono text-xs font-bold border transition ${isCurr ? 'bg-ink text-white border-ink' : (isAns ? 'bg-sageSoft text-sage border-sage/40' : 'bg-white text-inkMuted border-sandBorder hover:bg-sand')}">
                  ${idx + 1}
                </button>
              `;
            }).join('')}
          </div>

          <div class="bg-white rounded-2xl border border-sandBorder p-6 shadow-editorial space-y-5">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-1 rounded-lg bg-sageSoft text-sage text-xs font-semibold">Eje ${q.axis}</span>
              <span class="px-2.5 py-1 rounded-lg bg-terracottaSoft text-terracotta text-xs font-semibold">${q.type}</span>
            </div>
            <div class="font-serif text-base sm:text-lg text-ink leading-relaxed whitespace-pre-line bg-sand/50 p-4 rounded-xl border border-sandBorder/70">
              ${q.stem}
            </div>
            <div class="space-y-2.5">
              ${q.options.map((optText, idx) => {
                const letter = letters[idx];
                const isSel = chosen === letter;
                return `
                  <button onclick="selectSimAnswer(${q.id}, '${letter}')" class="w-full min-h-[48px] p-3.5 rounded-xl border text-left text-sm leading-relaxed transition ${isSel ? 'bg-sageSoft border-sage text-ink font-semibold ring-1 ring-sage' : 'bg-white border-sandBorder text-ink hover:bg-sand'}">
                    ${optText}
                  </button>
                `;
              }).join('')}
            </div>

            <div class="flex items-center justify-between pt-2">
              <button ${simSession.currentIndex === 0 ? 'disabled' : ''} onclick="goToSimQuestion(${simSession.currentIndex - 1})" class="min-h-[44px] px-4 py-2 rounded-xl border border-sandBorder text-sm font-semibold disabled:opacity-40 hover:bg-sand transition">
                ← Anterior
              </button>
              ${simSession.currentIndex < simSession.questions.length - 1 ? `
                <button onclick="goToSimQuestion(${simSession.currentIndex + 1})" class="min-h-[44px] px-5 py-2 rounded-xl bg-sage text-white text-sm font-semibold hover:bg-sage/90 transition">
                  Siguiente →
                </button>
              ` : `
                <button onclick="finishSimulator(false)" class="min-h-[44px] px-5 py-2 rounded-xl bg-terracotta text-white text-sm font-semibold hover:bg-terracotta/90 transition">
                  Entregar Simulacro ✓
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

       17. SECCIÓN 6: FICHA OFICIAL CONVOCATORIA 242-2026 & RESPALDO PWA
